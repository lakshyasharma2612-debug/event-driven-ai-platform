global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "api-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-service:8080"]

  - job_name: "analysis-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["analysis-service:8081"]