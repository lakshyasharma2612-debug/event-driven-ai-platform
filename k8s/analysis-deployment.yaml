apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: event-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analysis-service

  template:
    metadata:
      labels:
        app: analysis-service

    spec:
      containers:
        - name: analysis-service
          image: event-platform-analysis:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: analysis-config

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc