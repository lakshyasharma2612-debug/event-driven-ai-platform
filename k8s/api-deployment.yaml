apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: event-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-service

  template:
    metadata:
      labels:
        app: api-service


    spec:
      containers:
        - name: api-service
          image: event-platform-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: api-config 
          
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc